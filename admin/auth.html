<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIVORAH | Admin Portal Gate</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #15120a 0%, #050505 100%);
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .glass-card {
            background: rgba(10, 10, 10, 0.75);
            border: 1px solid rgba(242, 202, 80, 0.15);
            backdrop-filter: blur(20px);
        }
        .glow-amber {
            box-shadow: 0 0 30px rgba(242, 202, 80, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Auth Card -->
    <div class="w-full max-w-md glass-card rounded-lg p-8 glow-amber border border-primary/20 relative">
        <!-- Return back button -->
        <a href="../index.html" class="absolute top-6 left-6 text-gray-500 hover:text-primary-container transition-colors flex items-center gap-1 text-xs uppercase tracking-widest font-semibold">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Site
        </a>
        
        <!-- Status indicator/Config Button -->
        <button id="auth-config-btn" class="absolute top-6 right-6 text-gray-500 hover:text-primary-container transition-colors" title="Manage Database Credentials">
            <span class="material-symbols-outlined text-base">settings</span>
        </button>

        <div class="text-center mb-8 mt-4">
            <div class="font-headline-md text-3xl text-primary-container tracking-[0.2em] uppercase leading-none font-semibold">
                shivorah
            </div>
            <div class="text-[10px] text-gray-500 tracking-[0.3em] uppercase mt-1">
                Admin CMS Guardian
            </div>
        </div>

        <!-- Auth Forms -->
        <form id="auth-form" class="space-y-6">
            <div id="alert-box" class="bg-red-500/10 border border-red-500/20 text-red-200 text-xs px-4 py-3 rounded-sm leading-relaxed hidden">
                <!-- Message -->
            </div>
            <div id="info-box" class="bg-primary/10 border border-primary/20 text-primary-container text-xs px-4 py-3 rounded-sm leading-relaxed hidden">
                <!-- Message -->
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">E-Mail Address</label>
                <input required id="email" type="email" placeholder="admin@shivorah.com" class="w-full bg-[#0a0a0a] border border-outline/20 rounded-sm text-sm text-white px-4 py-3 focus:border-primary focus:ring-0 placeholder:text-gray-800 transition-colors"/>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-widest text-gray-400">Security Password</label>
                </div>
                <input required id="password" type="password" placeholder="••••••••••••" class="w-full bg-[#0a0a0a] border border-outline/20 rounded-sm text-sm text-white px-4 py-3 focus:border-primary focus:ring-0 placeholder:text-gray-800 transition-colors"/>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-primary text-black font-semibold text-xs py-4 uppercase tracking-widest hover:bg-white transition-all duration-300">
                Sign In to Console
            </button>
        </form>

        <!-- Toggle Auth Type -->
        <div class="text-center mt-8 pt-6 border-t border-white/5">
            <button id="toggle-auth-btn" class="text-xs text-gray-500 hover:text-primary-container transition-colors font-medium">
                New admin setup? Sign Up instead
            </button>
        </div>
    </div>

    <!-- DB config fallback modal if config.js is not initialized -->
    <div id="auth-config-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-md px-4">
        <div class="bg-[#0a0a0a] border border-[#d4af37]/30 w-full max-w-sm p-8 shadow-2xl flex flex-col gap-6 relative rounded-sm">
            <button id="auth-config-close" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-2xl">close</span>
            </button>
            <div class="text-center">
                <span class="material-symbols-outlined text-4xl text-primary-container">database</span>
                <h3 class="text-xl font-headline-md text-white mt-2">Supabase Credentials</h3>
                <p class="text-xs text-gray-400 mt-1">Configure your backend endpoints to login.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1.5 font-semibold">Supabase URL</label>
                    <input id="modal-config-url" type="url" placeholder="https://xxxxxx.supabase.co" class="w-full bg-[#0f0f0f] border border-outline-variant/20 rounded-sm text-sm text-white px-3 py-2 focus:border-primary focus:ring-0 placeholder:text-gray-700"/>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1.5 font-semibold">Anon Public Key</label>
                    <input id="modal-config-key" type="password" placeholder="eyJhbGciOiJIUzI1NiIs..." class="w-full bg-[#0f0f0f] border border-outline-variant/20 rounded-sm text-sm text-white px-3 py-2 focus:border-primary focus:ring-0 placeholder:text-gray-700"/>
                </div>
            </div>
            <div class="flex gap-4">
                <button id="modal-config-clear" class="flex-grow border border-red-500/30 text-red-400 hover:bg-red-500/10 text-xs py-3 uppercase tracking-wider transition-all">Clear</button>
                <button id="modal-config-save" class="flex-grow bg-primary text-black text-xs py-3 uppercase tracking-widest font-semibold hover:bg-white transition-all">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Auth Logic
        let supabaseClient = null;
        let isSignUp = false;
        
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-auth-btn');
        
        const alertBox = document.getElementById('alert-box');
        const infoBox = document.getElementById('info-box');
        
        const configBtn = document.getElementById('auth-config-btn');
        const configModal = document.getElementById('auth-config-modal');
        const configClose = document.getElementById('auth-config-close');
        const configSave = document.getElementById('modal-config-save');
        const configClear = document.getElementById('modal-config-clear');
        
        const configUrl = document.getElementById('modal-config-url');
        const configKey = document.getElementById('modal-config-key');

        function init() {
            const url = window.ENV?.SUPABASE_URL || localStorage.getItem('SUPABASE_URL');
            const key = window.ENV?.SUPABASE_ANON_KEY || localStorage.getItem('SUPABASE_ANON_KEY');
            
            if (url && key) {
                try {
                    supabaseClient = supabase.createClient(url, key);
                    configBtn.classList.remove('text-gray-500');
                    configBtn.classList.add('text-primary');
                } catch(e) {
                    showError("Database Init Error: " + e.message);
                }
            } else {
                configBtn.classList.remove('text-primary');
                configBtn.classList.add('text-red-500');
                showInfo("Please configure your Supabase URL & Anon Key clicking the settings wheel before signing in.");
            }
            
            // Check if already logged in as admin
            checkExistingSession();
        }

        async function checkExistingSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const isAdmin = await verifyAdminRole(session.user.id);
                if (isAdmin) {
                    window.location.href = 'index.html';
                }
            }
        }

        async function verifyAdminRole(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .single();
                    
                if (error) throw error;
                return data && data.role === 'admin';
            } catch (err) {
                console.error("Role lookup failed:", err);
                return false;
            }
        }

        function showError(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            infoBox.classList.add('hidden');
        }

        function showInfo(msg) {
            infoBox.innerText = msg;
            infoBox.classList.remove('hidden');
            alertBox.classList.add('hidden');
        }

        // Toggle sign in vs sign up
        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                submitBtn.innerText = 'Register Admin Account';
                toggleBtn.innerText = 'Existing admin? Sign In instead';
                showInfo("The database trigger automatically grants the first registered account 'admin' access rights.");
            } else {
                submitBtn.innerText = 'Sign In to Console';
                toggleBtn.innerText = 'New admin setup? Sign Up instead';
                infoBox.classList.add('hidden');
            }
        });

        // Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            
            if (!supabaseClient) {
                showError("Supabase is not configured. Click the settings wheel to add credentials.");
                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            submitBtn.disabled = true;
            submitBtn.innerText = isSignUp ? 'Registering...' : 'Authenticating...';

            try {
                if (isSignUp) {
                    // Sign Up
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password
                    });
                    
                    if (error) throw error;
                    
                    if (data.user) {
                        showInfo("Signup complete! Verifying admin authority...");
                        // Delay briefly for DB triggers to complete profile insert
                        setTimeout(async () => {
                            const isAdmin = await verifyAdminRole(data.user.id);
                            if (isAdmin) {
                                window.location.href = 'index.html';
                            } else {
                                showError("Registration successful, but your account lacks admin credentials. Ask your database owner to upgrade your profile role.");
                                await supabaseClient.auth.signOut();
                            }
                            submitBtn.disabled = false;
                        }, 2500);
                    }
                } else {
                    // Sign In
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });
                    
                    if (error) throw error;
                    
                    if (data.user) {
                        const isAdmin = await verifyAdminRole(data.user.id);
                        if (isAdmin) {
                            window.location.href = 'index.html';
                        } else {
                            showError("Access Denied: Your profile role is 'user'. Only administrators may access the CMS dashboard.");
                            await supabaseClient.auth.signOut();
                            submitBtn.disabled = false;
                            submitBtn.innerText = 'Sign In to Console';
                        }
                    }
                }
            } catch (err) {
                showError(err.message || "An authentication error occurred.");
                submitBtn.disabled = false;
                submitBtn.innerText = isSignUp ? 'Register Admin Account' : 'Sign In to Console';
            }
        });

        // Config Modal
        configBtn.addEventListener('click', () => {
            configUrl.value = window.ENV?.SUPABASE_URL || localStorage.getItem('SUPABASE_URL') || '';
            configKey.value = window.ENV?.SUPABASE_ANON_KEY || localStorage.getItem('SUPABASE_ANON_KEY') || '';
            configModal.classList.remove('hidden');
            configModal.classList.add('flex');
        });
        
        configClose.addEventListener('click', () => {
            configModal.classList.add('hidden');
            configModal.classList.remove('flex');
        });
        
        configSave.addEventListener('click', () => {
            const url = configUrl.value.trim();
            const key = configKey.value.trim();
            if (!url || !key) {
                alert("Credentials are required.");
                return;
            }
            localStorage.setItem('SUPABASE_URL', url);
            localStorage.setItem('SUPABASE_ANON_KEY', key);
            configModal.classList.add('hidden');
            configModal.classList.remove('flex');
            init();
            alert("Database credentials loaded.");
        });
        
        configClear.addEventListener('click', () => {
            localStorage.removeItem('SUPABASE_URL');
            localStorage.removeItem('SUPABASE_ANON_KEY');
            configModal.classList.add('hidden');
            configModal.classList.remove('flex');
            init();
            alert("Local storage credentials cleared.");
        });

        // Init load
        init();
    </script>
</body>
</html>
